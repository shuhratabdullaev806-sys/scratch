<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--primary:#4361ee;--primary-dark:#3a0ca3;--secondary:#7209b7;--accent:#f72585;}
  html,body{margin:0;padding:0;width:608px;height:1080px;overflow:hidden;background:#120a2c;font-family:'Outfit',sans-serif;}
  .stage{position:relative;width:608px;height:1080px;overflow:hidden;
    background:linear-gradient(180deg, #150b30 0%, #1c0f3a 40%, #2a0e3a 100%);}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size:38px 38px;}

  .glow{position:absolute;left:304px;top:270px;width:440px;height:440px;transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(114,9,183,0.55), rgba(67,97,238,0.25) 55%, transparent 72%);
    filter:blur(6px);}

  .content{position:absolute;left:0;right:0;top:560px;text-align:center;padding:0 34px;}

  .pill{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:999px;margin-bottom:20px;
    background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.28);
    color:#fff;font-weight:600;font-size:14.5px;letter-spacing:1.6px;
    opacity:0;transform:translateY(14px);animation:up .45s ease .05s forwards;}
  .pill i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}

  .kodeks{color:rgba(255,255,255,0.65);font-weight:600;font-size:16px;letter-spacing:2px;text-transform:uppercase;
    margin-bottom:8px;opacity:0;transform:translateY(14px);animation:up .45s ease .22s forwards;}

  .modda{position:relative;display:inline-block;font-weight:900;font-size:58px;color:#fff;letter-spacing:-0.5px;
    padding:6px 14px;opacity:0;transform:translateY(14px) scale(0.94);animation:up .5s cubic-bezier(.2,.85,.25,1.1) .40s forwards;}
  .modda .sweep{position:absolute;left:0;top:14%;height:72%;width:0;background:linear-gradient(90deg, var(--accent), var(--secondary));
    border-radius:8px;opacity:0.85;z-index:-1;animation:sweep .55s cubic-bezier(.3,.8,.2,1) .78s forwards;}
  @keyframes sweep{to{width:100%;}}
  @keyframes up{to{opacity:1;transform:translateY(0) scale(1);}}

  .quote{margin:26px auto 0;max-width:470px;padding:22px 26px;border-radius:24px;text-align:left;
    background:linear-gradient(160deg, rgba(255,255,255,0.13), rgba(255,255,255,0.05));
    border:1.5px solid rgba(255,255,255,0.26);
    box-shadow:0 18px 40px -10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.35);
    opacity:0;transform:translateY(16px);animation:up .5s ease 1.35s forwards;}
  .quote .q{color:var(--accent);font-size:34px;font-weight:900;line-height:0.4;position:relative;top:10px;}
  .quote p{margin:0;color:#fff;font-weight:600;font-size:19px;line-height:1.42;text-shadow:0 2px 8px rgba(0,0,0,0.4);}
  .quote p b{color:#ffd1e6;font-weight:800;}
</style></head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="content">
    <div class="pill"><i></i>QONUN NIMA DEYDI?</div>
    <div class="kodeks">Soliq kodeksi</div>
    <div class="modda"><span class="sweep"></span>248-MODDASI</div>
    <div class="quote">
      <span class="q">&ldquo;</span>
      <p>Tovar <b>bozor narxidan past</b> yoki tekin berilsa — soliq bazasi <b>bozor narxi</b> (kamida tannarx) bo'ladi.</p>
    </div>
  </div>
</div>
</body></html>
