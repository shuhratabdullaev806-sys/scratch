<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  html,body{margin:0;padding:0;background:transparent;}
  .wrap{width:400px;height:400px;position:relative;}
  svg{position:absolute;inset:0;}
</style></head>
<body>
<div class="wrap">
<svg width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f72585"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="192" fill="none" stroke="url(#g)" stroke-width="7" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="192" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>
</svg>
</div>
</body></html>
